# Example systemd drop-in for an engine unit: start after service-ple and pass the address to a launch script that adds
# --additional-config '{"service_ple": "'$SPLE'"}' to `vllm serve`.
[Unit]
Wants=service-ple.service
After=service-ple.service
[Service]
Environment=SPLE=unix:/run/service-ple/agente.sock;127.0.0.1:18460
