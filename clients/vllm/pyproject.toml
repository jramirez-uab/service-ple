[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-service-ple"
version = "0.2.0"
description = "vLLM plugin: serve the Flash-Next PLE table from service-ple (network server + local agent) instead of pinning 64 GiB of host RAM"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
service_ple = "vllm_service_ple:register"

[tool.setuptools.package-data]
vllm_service_ple = ["libserviceple.so"]
