[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-service-ple"
version = "0.2.0"
description = "vLLM plugin: keeps the Flash-Next PLE table out of the vLLM process (per-machine agent with a shared cache, local file and/or central server)"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
service_ple = "vllm_service_ple:register"

[tool.setuptools.package-data]
vllm_service_ple = ["libserviceple.so"]
