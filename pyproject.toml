# Python wheel of the vLLM plugin with the client library (libserviceple.so) built by CMake. The server and the agent are not in it:
# they are system services (deploy/install.sh). Version: clients/vllm/pyproject.toml (the one install.sh uses), so there is one source.
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "vllm-service-ple"
dynamic = ["version"]
description = "vLLM plugin: keeps the Flash-Next PLE table out of the vLLM process (per-machine agent with a shared cache, local file and/or central server)"
readme = "clients/vllm/README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jorge Ramírez Espejo" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/jramirez-uab/service-ple"
Issues = "https://github.com/jramirez-uab/service-ple/issues"

[project.entry-points."vllm.general_plugins"]
service_ple = "vllm_service_ple:register"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/wheel"
cmake.build-type = "Release"
build.targets = ["serviceple"]
wheel.packages = ["clients/vllm/vllm_service_ple"]
wheel.py-api = "py3"                     # the library does not use the Python C API: one wheel for every Python 3
sdist.exclude = ["/build*/", "**/__pycache__/"]   # the sdist is the repository (git-tracked files) without build trees

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "clients/vllm/pyproject.toml"
regex = '(?m)^version = "(?P<value>[^"]+)"'

[tool.cibuildwheel]
build = "cp312-manylinux_x86_64"         # py3-none wheel: one build is enough
manylinux-x86_64-image = "manylinux_2_28"
test-command = "python -c \"import ctypes, os, vllm_service_ple as m; ctypes.CDLL(os.path.join(os.path.dirname(m.__file__), 'libserviceple.so')).sple_abrir\""
